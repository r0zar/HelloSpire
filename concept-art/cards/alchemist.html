  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--ink);color:var(--parchment);font-family:'Spectral',Georgia,serif;line-height:1.6;-webkit-font-smoothing:antialiased;}
  a{color:var(--brass-bright);}

  h1,h2{font-family:'IM Fell English SC',Georgia,serif;font-weight:400;text-wrap:balance;color:var(--parchment);margin:0;}
  .kicker{font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--verdigris);margin:0 0 8px;}
  h1{font-size:clamp(2.2rem,5vw,3.2rem);}
  .sub{font-family:'IBM Plex Mono',monospace;color:var(--parchment-dim);font-size:.85rem;margin-top:10px;}

  .section-head .count{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--parchment-dim);}

  .card{
    position:relative;
    aspect-ratio:5/7.4;
    border-radius:10px;
    padding:5px;
    transition:transform .15s ease, box-shadow .15s ease;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));
  }
  .card:hover{ transform:translateY(-4px) scale(1.02); }
  .card[data-rarity="Common"]{ background:linear-gradient(155deg,var(--frame-common-a),var(--frame-common-b)); }
  .card[data-rarity="Uncommon"]{ background:linear-gradient(155deg,var(--frame-uncommon-a),var(--frame-uncommon-b)); }
  .card[data-rarity="Rare"]{ background:linear-gradient(155deg,var(--frame-rare-a),var(--frame-rare-b)); }
  .card[data-rarity="Basic"],.card[data-rarity="Starter"],.card[data-rarity="Shop"],.card[data-rarity="Multiplayer"]{ background:linear-gradient(155deg,var(--frame-basic-a),var(--frame-basic-b)); }
  .card-inner{
    background:var(--ink); height:100%; border-radius:7px;
    display:flex; flex-direction:column; overflow:hidden; position:relative;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.4);
  }
  .corner{ position:absolute; width:7px; height:7px; background:inherit; transform:rotate(45deg); border-radius:1px; box-shadow:0 0 0 1px rgba(0,0,0,.35); z-index:3; }
  .card[data-rarity="Common"] .corner{ background:linear-gradient(135deg,var(--frame-common-a),var(--frame-common-b)); }
  .card[data-rarity="Uncommon"] .corner{ background:linear-gradient(135deg,var(--frame-uncommon-a),var(--frame-uncommon-b)); }
  .card[data-rarity="Rare"] .corner{ background:linear-gradient(135deg,var(--frame-rare-a),var(--frame-rare-b)); }
  .card[data-rarity="Basic"] .corner,.card[data-rarity="Starter"] .corner,.card[data-rarity="Shop"] .corner,.card[data-rarity="Multiplayer"] .corner{ background:linear-gradient(135deg,var(--frame-basic-a),var(--frame-basic-b)); }
  .corner.tl{ top:-3px; left:-3px; } .corner.tr{ top:-3px; right:-3px; }
  .corner.bl{ bottom:-3px; left:-3px; } .corner.br{ bottom:-3px; right:-3px; }
  .gem{
    position:absolute; top:-9px; left:-9px; width:26px; height:26px; z-index:4;
    transform:rotate(45deg); border-radius:4px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 5px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.25);
  }
  .card[data-rarity="Common"] .gem{ background:linear-gradient(135deg,var(--frame-common-a),var(--frame-common-b)); }
  .card[data-rarity="Uncommon"] .gem{ background:linear-gradient(135deg,var(--frame-uncommon-a),var(--frame-uncommon-b)); }
  .card[data-rarity="Rare"] .gem{ background:linear-gradient(135deg,var(--frame-rare-a),var(--frame-rare-b)); }
  .card[data-rarity="Basic"] .gem,.card[data-rarity="Starter"] .gem,.card[data-rarity="Shop"] .gem,.card[data-rarity="Multiplayer"] .gem{ background:linear-gradient(135deg,var(--frame-basic-a),var(--frame-basic-b)); }
  .gem span{ transform:rotate(-45deg); font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:.72rem; color:#1a1510; text-shadow:0 1px 0 rgba(255,255,255,.3); }
  .rarity-tag{
    position:absolute; top:5px; right:7px; font-family:'IBM Plex Mono',monospace;
    font-size:.48rem; letter-spacing:.04em; text-transform:uppercase; color:rgba(255,255,255,.55); z-index:2;
  }
  .art{
    flex:0 0 42%; display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
    background:radial-gradient(80% 100% at 50% 30%, var(--ink-3), var(--ink) 75%);
  }
  .art svg{ width:46%; height:46%; }
  .banner{
    position:relative; margin:-8px 4px 0; padding:5px 10px 4px;
    clip-path:polygon(3% 0,97% 0,100% 50%,97% 100%,3% 100%,0% 50%);
    display:flex; align-items:center; justify-content:center; z-index:2;
    box-shadow:0 2px 4px rgba(0,0,0,.4);
  }
  .banner[data-type="Attack"]{ background:linear-gradient(180deg,var(--type-attack-a),var(--type-attack-b)); }
  .banner[data-type="Skill"]{ background:linear-gradient(180deg,var(--type-skill-a),var(--type-skill-b)); }
  .banner[data-type="Power"]{ background:linear-gradient(180deg,var(--type-power-a),var(--type-power-b)); }
  .banner[data-type="Relic"],.banner[data-type="Potion"]{ background:linear-gradient(180deg,var(--type-neutral-a),var(--type-neutral-b)); }
  .name{
    font-family:'IM Fell English SC',Georgia,serif; font-size:.72rem; text-align:center;
    color:#f3ead2; line-height:1.1; text-wrap:balance; text-shadow:0 1px 1px rgba(0,0,0,.5);
  }
  .type{
    text-align:center; font-family:'IBM Plex Mono',monospace; font-size:.5rem;
    letter-spacing:.1em; text-transform:uppercase; color:var(--parchment-dim); margin:3px 0 0;
  }
  .text{
    flex:1; font-size:.6rem; padding:6px 9px 8px; color:var(--parch-ink);
    line-height:1.32; overflow:hidden; background:var(--parch-bg);
    margin-top:6px; font-family:'Spectral',serif;
  }
  footer{margin-top:70px;padding-top:20px;border-top:1px solid var(--hairline);font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--parchment-dim);}
</style>

function pickIcon(card){
  const text = card[4], type = card[2];
  const lead = text.split(/[.]/)[0].toLowerCase(); // primary clause only — a mention in a bonus clause shouldn't override the card's real type
  if(type==="Relic"||type==="Potion") return "i-flask";
  if(type==="Power") return "i-aura";
  if(type==="Attack") return "i-sword";
  // Skills: pick by primary verb
  if(/render/.test(lead)) return "i-heart";
  if(/^brew/.test(lead)) return "i-flask";
  if(/^distill/.test(lead)) return "i-drop";
  if(/invest/.test(lead)) return "i-coin";
  if(/upgrade/.test(lead)) return "i-cycle";
  if(/slot/.test(lead)) return "i-slots";
  if(/gold/.test(lead)) return "i-coin";
  if(/block/.test(lead)) return "i-shield";
  if(/exhaust/.test(lead)) return "i-flame";
  return "i-shield";
}

function renderSection(title, cards){
  const grid = cards.map(c=>{
    const [n,cost,type,rarity,text] = c;
    const icon = pickIcon(c);
    const tint = {Common:"var(--common)",Uncommon:"var(--uncommon)",Rare:"var(--rare)",Basic:"var(--basic)",Starter:"var(--brass-bright)",Shop:"var(--brass-bright)",Multiplayer:"var(--verdigris)"}[rarity]||"var(--parchment-dim)";
    return `<div class="card" data-rarity="${rarity}">
      <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
      <div class="card-inner">
        ${cost!=="-"?`<div class="gem"><span>${cost}</span></div>`:""}
        <div class="rarity-tag">${rarity}</div>
        <div class="art" style="color:${tint}"><svg><use href="#${icon}"/></svg></div>
        <div class="banner" data-type="${type}"><div><div class="name">${n}</div><div class="type">${type}</div></div></div>
        <div class="text">${text}</div>
      </div>
    </div>`;
  }).join("");
  return `<section><div class="section-head"><h2>${title}</h2><span class="count">${cards.length} ${cards.length===1?"card":"cards"}</span></div><div class="grid">${grid}</div></section>`;
}

document.getElementById("sections").innerHTML =
  renderSection("Basic", BASIC) +
  renderSection("Common", COMMON) +
  renderSection("Uncommon", UNCOMMON) +
  renderSection("Rare", RARE) +
  renderSection("Relics", RELICS) +
  renderSection("Potions", POTIONS) +
  renderSection("Multiplayer", MULTIPLAYER);

document.getElementById("tally").textContent =
  `${BASIC.length+COMMON.length+UNCOMMON.length+RARE.length} cards, ${RELICS.length} relics, ${POTIONS.length} potions, ${MULTIPLAYER.length} multiplayer cards — ${BASIC.length+COMMON.length+UNCOMMON.length+RARE.length+RELICS.length+POTIONS.length+MULTIPLAYER.length} total.`;
</script>
